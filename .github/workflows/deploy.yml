name: Deploy

# Deploys only from the default branch, and only after the content guards pass.
# Nothing reaches a live domain without clearing the duplicate-copy check and
# the brokerage vocabulary check first. Those are the two rules the whole
# network depends on, so they gate the deploy rather than merely reporting.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build every live site
        run: npm run build:all

      - name: Copy, content and duplicate checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit
        run: npm run audit:a11y

      # Runs with no secrets in the environment on purpose. It stubs Notion and
      # asserts what happens to a lead when the save fails, which is the case a
      # real token would hide.
      - name: Lead receiver
        run: npm run verify:receiver

      - name: Intake form end to end
        run: npm run verify:form

      # A lead capture network with nowhere to send a lead is worse than no
      # site, because the form tells people it worked. This blocks that.
      - name: Lead destination configured
        run: npm run check:leads
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PUBLIC_LEAD_WEBHOOK: ${{ secrets.PUBLIC_LEAD_WEBHOOK }}
          PUBLIC_CRMX_EMBED: ${{ secrets.PUBLIC_CRMX_EMBED }}

      # Cloudflare receives finished files and never builds anything, so no
      # build minutes are metered and the checks above cannot be skipped.
      #
      # NOTION_TOKEN is read here only to decide whether the form can be shown.
      # Its value never enters a built file: the receiver reads it at runtime
      # from a Cloudflare Worker secret instead.
      - name: Rebuild with the live lead destination
        run: npm run build:all
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PUBLIC_LEAD_WEBHOOK: ${{ secrets.PUBLIC_LEAD_WEBHOOK }}
          PUBLIC_CRMX_EMBED: ${{ secrets.PUBLIC_CRMX_EMBED }}

      # Last chance to catch a credential leaking into a page a visitor can read.
      - name: No secret reached the built files
        run: npm run check:secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # CLOUDFLARE_API_TOKEN is account scoped and can publish Workers but not
      # touch a domain. Domain work uses CLOUDFLARE_ZONE_TOKEN and runs from
      # scripts/setup-zones.mjs, deliberately not from here, so a domain problem
      # can never stop a site being published.
      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
