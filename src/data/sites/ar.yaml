hero:
  headline: Do you own rural land in Arkansas near power lines?
  subhead: >-
    We buy and option Arkansas land for data center development. We are the
    buyer, not a middleman. Tell us where your property is and we will tell you
    honestly whether it fits.

# Answers the question the page is named for, in the first paragraph.
directAnswer: >-
  Start by finding out whether your land is close enough to electric
  transmission to be worth a serious look, because in Arkansas that is what
  decides nearly every case. You do not need a survey, an engineer, or a parcel
  number to find out. Tell us the county, roughly how many acres you own, and
  anything you have noticed nearby such as large steel towers, a fenced
  electrical yard, or a gas line. We check it against public records at our own
  cost, usually within a few days. If it fits we call you to talk about buying
  the land outright or paying you for an option while we confirm the site works.
  If it does not fit we tell you that plainly and explain what was missing.
  There is no fee to you at any point.

trustPoints:
  - title: Arkansas is where we are actually looking
    body: >-
      This is not a national site with the state name swapped in. We follow
      Arkansas transmission, the utilities that serve it, and which counties
      have room on the system. When we call you, we have already looked at your
      part of the state.
  - title: We buy, we do not shop your land around
    body: >-
      The money is ours and so is the risk. We are not putting your property in
      front of other parties and collecting on the outcome. If we want it, we
      make you an offer ourselves, and if we do not, nothing happens.
  - title: A no from us costs you nothing
    body: >-
      Most Arkansas land will not support a project like this, usually because
      of distance from transmission. We would rather tell you that in a week
      than let you wonder for a year. There is no charge and no obligation
      either way.

pageCopy:
  howItWorks:
    intro: >-
      Arkansas landowners have been getting more letters and phone calls about
      their property since the data center announcements started. Some of those
      approaches are serious and some are not. Here is exactly what happens when
      you contact us, so you can compare it against whatever else has landed in
      your mailbox.
    steps:
      - >-
        Send the short form with your county and a rough acreage. If you know
        what is near the property, tell us. If you do not, say so. We would far
        rather have an honest not sure than a guess we end up relying on.
      - >-
        We check your property against Arkansas transmission maps, substation
        locations, county road data, and floodplain maps. All of it is public
        record and none of it costs you anything. This is the step that answers
        most of the question.
      - >-
        If the property could work, we call. We tell you what we found, what we
        are still unsure about, and what buying it or taking an option on it
        would look like in practical terms for you and your family.
      - >-
        When it fits, terms go in writing. When it does not, we say so and tell
        you why, whether that is distance from the grid, the shape of the
        parcel, or ground that would cost too much to prepare.
    closing: >-
      Nothing in that sequence asks you to spend money, sign anything to keep
      talking, or take your land off the table while you think. If you want to
      stop, stop. Most conversations end with us saying the property does not
      fit, and we try to reach that answer quickly rather than slowly.
  articles:
    intro: >-
      Guides for Arkansas landowners on how this process works here, what the
      power situation in your part of the state means for you, and how to read
      an approach from someone wanting your ground.
    empty: >-
      The first Arkansas pieces are being written now. Until they appear, the
      questions page covers most of what landowners in this state ask us, and
      you can always send a question directly.
  qualify:
    intro: >-
      What makes a piece of Arkansas land interesting to a data center developer
      has very little to do with what makes it good farm ground or good hunting
      ground. The questions below are the ones we actually work through, in the
      order they usually matter.
    criteria:
      - >-
        Arkansas is served by a mix of large utilities and rural cooperatives,
        and the capacity picture differs sharply between them. What we look for
        is high voltage transmission close enough to reach without building
        miles of new line. If you can see tall steel lattice towers from your
        place, or a fenced yard full of electrical equipment, that is the single
        most useful thing you can tell us.
      - >-
        Enough ground in one piece to lay out buildings, equipment yards, and
        setbacks without fighting the boundary. Arkansas parcels are frequently
        split by a county road, a creek, or a rail line, which makes the same
        acreage harder to use. It does not rule a property out, it just changes
        the math.
      - >-
        A dependable water supply helps for cooling, though it matters far less
        than people expect and some designs use very little. A rural water
        district connection, a good well, or a creek all count. This is rarely
        the reason a site succeeds or fails in Arkansas.
      - >-
        Fiber routes in Arkansas tend to follow the interstates and the rail
        corridors. Being near one of those helps, but fiber is usually cheaper
        and quicker to extend than electric capacity, so it is a smaller
        obstacle than the power question.
      - >-
        Construction means a great deal of heavy truck traffic. A property
        reached from a paved state or county highway starts well ahead of one at
        the end of several miles of gravel. Flat, well drained ground outside
        the floodplain also costs far less to prepare, which shows up directly
        in what anyone can offer you.
    closing: >-
      Very few properties check every box and we do not expect yours to. Power
      is the item that decides most Arkansas cases, and the rest is a question
      of cost. If you are not sure where your land stands, that is the reason to
      ask rather than a reason to stay quiet.

utilitiesNote: >-
  Arkansas is split between several large utilities and a wide network of rural
  cooperatives, and the capacity picture is genuinely different between them.
  Knowing who bills you tells us a good deal before we look at anything else.
  You do not need to work any of this out first. It is set out here because
  landowners ask about it often.

utilities:
  - name: Entergy Arkansas
    kind: investor-owned
    note: Serves much of central and eastern Arkansas.
  - name: Southwestern Electric Power Company, known as SWEPCO
    kind: investor-owned
    note: Serves much of northwest and western Arkansas.
  - name: Oklahoma Gas and Electric
    kind: investor-owned
    note: Serves part of western Arkansas from its Oklahoma system.
  - name: Empire District Electric
    kind: investor-owned
    note: Serves a small area in the north of the state.
  - name: Arkansas Electric Cooperative Corporation
    kind: generation
    note: >-
      Supplies wholesale power to the distribution cooperatives that cover most
      of rural Arkansas.
  - name: Member distribution cooperatives
    kind: cooperative
    note: >-
      Local cooperatives such as First Electric, Ozarks Electric, Craighead
      Electric, and Petit Jean Electric deliver power across most rural counties.
  - name: City owned utilities
    kind: municipal
    note: >-
      A number of Arkansas cities run their own electric systems, among them
      Jonesboro, Conway, North Little Rock, West Memphis, Osceola, Paragould,
      Benton, Bentonville, Clarksville, Siloam Springs, Hope, and Prescott.

incentives:
  summary: >-
    Arkansas created a sales and use tax exemption for qualified data centers in
    2023, under Act 819, which sits in the state code at section 26-52-456. The
    legislature widened it in 2025 under Act 548, lowering the investment level a
    project has to reach and broadening what the exemption covers. Cryptocurrency
    mining operations are specifically left out. Arkansas also changed how energy
    projects are permitted, and several large data center projects have been
    announced in the state since. The part that matters to you is simple and
    often misunderstood. The tax exemption belongs to the company building the
    data center, not to you as the landowner. You do not apply for anything, you
    do not receive a credit, and it does not by itself change what your land is
    worth. What it does mean is that well funded companies have a live reason to
    be looking at Arkansas ground right now, which is a large part of why we are.
    Programs change and the details run well beyond what a paragraph can carry,
    so treat this as background rather than advice, and check anything that would
    affect a decision with your own accountant.
  sources:
    - label: Arkansas Code section 26-52-456, data centers
      url: https://law.justia.com/codes/arkansas/title-26/subtitle-5/chapter-52/subchapter-4/section-26-52-456/
      accessed: '2026-07-30'
    - label: Kutak Rock, expansion of the data center exemption by Act 548 of 2025
      url: https://www.kutakrock.com/newspublications/publications/2025/april/expansion-sales-use-tax-data-center-exemption
      accessed: '2026-07-30'
    - label: Arkansas Advocate, understanding the data center boom and debate
      url: https://arkansasadvocate.com/2026/05/22/arkansas-explained-understanding-the-data-center-boom-and-debate/
      accessed: '2026-07-30'
    - label: Arkansas Economic Development Commission, electric utilities
      url: https://www.arkansasedc.com/why-arkansas/infrastructure/electric-utilities
      accessed: '2026-07-30'

regions:
  - title: Central Arkansas
    body: >-
      Pulaski, Faulkner, and Saline counties sit where the interstates, the
      Arkansas River, and a dense part of the transmission system come together.
      It is the most heavily worked part of the state for projects like this,
      which cuts both ways. The infrastructure is there, and so is competition
      for it.
  - title: The Delta and Northeast Arkansas
    body: >-
      Craighead, Mississippi, and Crittenden counties have something unusual
      going for them. Decades of heavy industry, particularly steel making
      around Osceola and Blytheville, mean electric infrastructure built for
      loads far larger than a rural county normally carries. Flat ground, rail,
      and river access come with it.
  - title: The Interstate 40 corridor east of Little Rock
    body: >-
      The stretch running toward West Memphis combines a major freight route,
      river crossings, and fiber that follows the highway. Land here is often
      flat and in large blocks, though floodplain is a genuine consideration and
      one of the first things we check.
  - title: Northwest Arkansas
    body: >-
      Benton and Washington counties have grown quickly and carry the
      infrastructure that comes with that growth. The tradeoff is terrain and
      land price. Parcels large enough and flat enough are harder to find here
      than in the east, so we tend to look a little further out.
  - title: The Arkansas River Valley
    body: >-
      Pope, Johnson, and Logan counties sit along the river and the Interstate
      40 route with generation nearby. Terrain varies a great deal over short
      distances here, so two properties a few miles apart can get very different
      answers from us.

faq:
  - question: I got a letter about my land. Is that you?
    answer: >-
      Probably not. Since the Arkansas data center announcements, a lot of
      parties have started contacting landowners, and they are not all the same
      kind of operation. Some are buyers, some are looking to tie up your
      property and pass it along, and some are simply gathering information. Ask
      anyone who contacts you two questions. Are you the buyer, and are you paid
      a commission. We are the buyer, and nobody here is paid a commission.

  - question: How close to a power line does my Arkansas land need to be?
    answer: >-
      There is no single distance, and anyone who gives you one is guessing.
      What matters is the voltage of the line, whether the nearby substation has
      capacity left, and what it would cost to connect. A property a mile from a
      major line with room on it can be far more workable than one a quarter
      mile from a line that is already spoken for. That is the research we do,
      and it is why we ask you to send the property rather than judge it
      yourself.

  - question: Would I sell the whole farm, or part of it?
    answer: >-
      That depends on the property and it is genuinely negotiable. Some projects
      need one contiguous block and some can work around a homestead, a family
      cemetery, or ground you want to keep in production. Tell us early what you
      want to hold onto. It is far easier to design around from the start than
      to unwind later.

  - question: My neighbors are not happy about data centers. What should I know?
    answer: >-
      There is real public debate in Arkansas about these projects, focused
      mostly on how much electricity and water they use and what that means for
      other customers. You will hear it at county meetings. We think you should
      go in knowing that rather than be surprised by it. If you are weighing a
      sale, the reaction of the people around you is a legitimate part of your
      decision, and we would rather discuss it openly than pretend it is not
      there.

  - question: What is my Arkansas land worth for this?
    answer: >-
      We will not put a number in front of you before we have looked, because
      any figure given that early is invented. Value for this use is driven by
      the power situation far more than by acreage, which is why two neighboring
      properties can be worth very different amounts. Once we have screened your
      property we can talk about real numbers.

  - question: Do you only want land near Little Rock?
    answer: >-
      No. Central Arkansas gets a lot of attention, but some of the most
      interesting ground in the state is out in the Delta, along the Interstate
      40 corridor, and in the river valley. Send us what you have wherever it
      is. We would rather look at a property in a county nobody is talking about
      than miss one.

  - question: How long does the whole thing take?
    answer: >-
      The screening is usually a few days. After that it depends entirely on the
      property and on you. An option can move quickly because it does not
      require everything to be settled up front, which is part of why landowners
      often prefer to start there. A full purchase takes longer because more has
      to be confirmed first. We give you a realistic timeline once we know what
      we are working with, rather than a promise up front.
